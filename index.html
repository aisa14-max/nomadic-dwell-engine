<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Locks the desktop tiling (Configurator*/Under the Hood/Tribe/etc,
         all built on Tailwind's lg: 1024px breakpoint) onto phones IN
         LANDSCAPE by lying to the browser about the viewport width, BEFORE
         it's parsed any CSS or run any React — a React-mounted effect runs
         too late and reads as the page loading in the wrong (stacked)
         layout for a moment before switching. Portrait deliberately stays
         on the normal responsive mobile layout — stretching the desktop
         tiling to fit a portrait-width phone made everything look
         stretched/oversized, so this only ever touches landscape. See
         src/components/MobileTiledViewport.tsx for the same check, kept in
         sync, which takes over for resize/rotation events once the app is
         actually running. Threshold (700) and target width (1400, matching
         the app's own max-w-[1400px] containers) must match that file
         exactly. -->
    <script>
      (function () {
        try {
          var isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
          if (!isTouch) return;
          if (!window.matchMedia("(orientation: landscape)").matches) return;
          var shortSide = Math.min(window.screen.width, window.screen.height);
          if (shortSide >= 700) return;
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) meta.setAttribute("content", "width=1400");
        } catch (e) { /* ignore — worst case, normal responsive layout applies */ }
      })();
    </script>

  <body>
    <div id="root"></div>
    <!-- TEMPORARY DIAGNOSTIC — remove once the black-screen issue is resolved.
         Surfaces client-side errors on the page itself so a blank screen shows
         what actually failed instead of hiding it. -->
    <script>
      (function () {
        function show(kind, msg) {
          var el = document.getElementById("__err__");
          if (!el) {
            el = document.createElement("pre");
            el.id = "__err__";
            el.style.cssText =
              "position:fixed;inset:0;z-index:2147483647;margin:0;padding:24px;" +
              "background:#140000;color:#ff9c9c;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;" +
              "white-space:pre-wrap;overflow:auto;";
            document.body.appendChild(el);
          }
          el.textContent += "[" + kind + "] " + msg + "\n\n";
        }
        window.addEventListener("error", function (e) {
          show("error", (e.message || "?") + "\n  at " + (e.filename || "?") + ":" + (e.lineno || "?") +
            (e.error && e.error.stack ? "\n" + e.error.stack : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("promise", (r && (r.stack || r.message)) || String(r));
        });
        // If React never paints, say so rather than showing a blank page.
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.children.length === 0) {
            show("mount", "React did not render within 12s (#root is empty).");
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
